name: daily

# 매일 잡 2개(병렬):
#  daily    — 국회의원·대통령 수집 → 스테이징 적재 → members/president MERGE(SCD2) → 변경 Issue → 사이트 재검증
#  mentions — 발화 수집(Google News·YouTube·디시) → stg_news/mentions_daily 적재 → merge_news → 감성(Claude 배치) → sentiment_daily 적재
#             원문은 pipeline/tmp/ 에만 두고 아티팩트에 올리지 않는다(CLAUDE.md 규칙 7).
# 적재·MERGE SQL은 이 파일과 pipeline/sql/dml/*.sql을 PR로 승인한 것으로 간주한다(CLAUDE.md 절대 규칙 1).

on:
  schedule:
    - cron: "0 19 * * *"  # 매일 04:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GCP_PROJECT: offorby
  BQ_DATASET: offorby
  BQ_LOCATION: asia-northeast3
  PYTHONIOENCODING: utf-8

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt

      - name: 국회의원 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python pipeline/python/collect_assembly.py

      - name: 대통령 수집(위키백과 + 대통령실 누리집 교차검증)
        run: python pipeline/python/collect_president.py

      - name: GCP 인증(쓰기용 서비스계정)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_WRITER }}
          # auth 액션은 GCP_PROJECT 등을 키 JSON의 project_id로 덮어쓴다 → 여기서 고정
          project_id: ${{ env.GCP_PROJECT }}

      - name: 스테이징 적재
        run: python pipeline/python/load_snapshot.py pipeline/out/assembly_$(date -u -d '+9 hours' +%Y%m%d).jsonl --table stg_assembly --approve

      - name: members MERGE
        run: python pipeline/python/apply_sql.py pipeline/sql/dml/merge_members.sql --approve

      - name: 대통령 스테이징 적재(날짜별 누적)
        run: python pipeline/python/load_snapshot.py pipeline/out/president_$(date -u -d '+9 hours' +%Y%m%d).jsonl --table stg_president --append --approve

      - name: president MERGE
        run: python pipeline/python/apply_sql.py pipeline/sql/dml/merge_president.sql --approve

      - name: 변경 내역 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pipeline/python/report_changes.py > changes.md
          if [ -s changes.md ]; then
            gh issue create --title "인물 변경 $(date -u -d '+9 hours' +%Y-%m-%d)" --body-file changes.md --label data-change
          else
            echo "변경 없음"
          fi

      - name: 사이트 재검증
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" https://offorby.vercel.app/api/revalidate)
          echo "revalidate HTTP $code"; test "$code" = "200"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: pipeline/out/

  mentions:
    runs-on: ubuntu-latest
    env:
      COLLECT_LIMIT: "20"        # 샘플 20명. 전원은 "0"
      SENTIMENT_DAILY_BUDGET_KRW: "3000"
      SENTIMENT_DAILY_LIMIT: "100"   # 첫 운영 기간 건수 상한(검증 후 0=없음으로)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt

      - name: GCP 인증(쓰기용 서비스계정)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_WRITER }}
          project_id: ${{ env.GCP_PROJECT }}

      - name: Google News 수집
        continue-on-error: true
        run: python pipeline/python/collect_gnews.py

      - name: YouTube 수집
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python pipeline/python/collect_youtube.py

      - name: 디시인사이드 수집
        continue-on-error: true
        run: python pipeline/python/collect_dc.py

      - name: 뉴스·언급량 적재
        run: |
          d=$(date -u -d '+9 hours' +%Y%m%d)
          [ -f pipeline/out/news_$d.jsonl ] && python pipeline/python/load_snapshot.py pipeline/out/news_$d.jsonl --table stg_news --append --approve
          for f in pipeline/out/mentions_*_$d.jsonl; do
            [ -f "$f" ] && python pipeline/python/load_snapshot.py "$f" --table mentions_daily --append --keys snapshot_date,source --approve
          done
          true

      - name: news MERGE(새 url만)
        run: python pipeline/python/apply_sql.py pipeline/sql/dml/merge_news.sql --approve

      - name: 감성 평가(Claude 배치)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/claude/sentiment.py

      - name: 감성 집계 적재
        run: |
          # 전날 미완 배치를 오늘 회수하면 sentiment_<전날>.jsonl 이 생기므로 날짜를 고정하지 않고 전부 적재
          n=0
          for f in pipeline/out/sentiment_*.jsonl; do
            [ -f "$f" ] || continue
            python pipeline/python/load_snapshot.py "$f" --table sentiment_daily --append --keys snapshot_date,source --approve; n=$((n+1))
          done
          [ "$n" = 0 ] && echo "감성 결과 없음(배치 미완 또는 입력 없음)"; true

      - name: 원문 임시 파일 제거(아티팩트 제외 보장)
        if: always()
        run: rm -rf pipeline/tmp

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mentions-snapshots
          path: pipeline/out/
